<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Hidden by URL and by search: never linked from the site, never indexed.
         The real lock is not obscurity though - it is GitHub: this page is
         useless without a GitHub login that has write access to the repo. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>The Roach — Journal Desk</title>
  </head>
  <body>
    <!-- Decap CMS (formerly Netlify CMS). Reads public/admin/config.yml,
         authenticates against GitHub through the decap-oauth container
         (see docker/oauth/), and writes markdown commits to content/blog/. -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
