# Decap CMS — the owner's journal desk at /admin/.
#
# Every save here is a git commit to main; the server's deploy watch picks the
# commit up and rebuilds. There is NO separate content database — the repo is
# the CMS store, which is why the site itself stays a static export.
#
# Auth is GitHub via the decap-oauth container (docker/oauth/), routed at
# /oauth/* by Caddy. The owner needs a GitHub account added as a collaborator
# on the repo — that collaborator grant IS the access control.

backend:
  name: github
  repo: GoodieGoodchild/theroach
  branch: main
  base_url: https://www.theroach.co.za
  auth_endpoint: oauth/auth
  commit_messages:
    create: 'journal: {{slug}}'
    update: 'journal: update {{slug}}'
    delete: 'journal: remove {{slug}}'
    uploadMedia: 'journal: media {{path}}'
    deleteMedia: 'journal: remove media {{path}}'

# Uploads land in the repo RAW; the build shrinks them into public/img/blog/
# under the same filename (scripts/optimise-blog-media.mjs), which is why
# public_folder can promise this path before the optimised file exists.
media_folder: content/blog/uploads
public_folder: /img/blog

collections:
  - name: journal
    label: The Daily Roach
    label_singular: Post
    folder: content/blog
    extension: md
    create: true
    slug: '{{slug}}'
    # Same law as the whole property, stated where the writer will see it:
    description: 'Notes on the craft, the culture and the law. No products, no prices, no offers — commentary only.'
    fields:
      - { label: Title, name: title, widget: string }
      - label: Date
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
      - label: Blurb
        name: blurb
        widget: text
        hint: 'One or two sentences — this is what Google shows under the title. Keep it under about 155 characters.'
      - { label: Published, name: published, widget: boolean, default: true }
      - { label: Cover image, name: image, widget: image, required: false }
      - { label: Body, name: body, widget: markdown }
