# The Roach — container for the static site.
#
# PORT MAPPING: "3010:80"
#   Host 3010 -> container 80. The container serves nginx on 80 (see Dockerfile:
#   the site is a static export, so stage 2 is nginx:alpine — there is no Node
#   process at runtime). So map to :80, NOT :3000 — nothing listens on 3000.
#
#   Ports 80 and 443 on this host are already held by Apache (probed 2026-07-27:
#   it serves the xneelo placeholder and answers TLS with xneelo's own
#   *.jnb2.host-h.net wildcard), so the container cannot take them. 3010 sits
#   behind whatever proxies for you.

services:
  theroach:
    build: .
    container_name: theroach
    restart: unless-stopped

    ports:
      # If your reverse proxy runs on THIS host, prefer "127.0.0.1:3010:80" —
      # Docker publishes straight past the host firewall, so the bare form makes
      # 3010 reachable from the internet and lets people bypass your TLS and the
      # 410 redirects by hitting the port directly. Left open here because a
      # proxy in another container or on another host needs to reach it.
      - "3010:80"

    # Static files only — nothing to persist, nothing writable.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
