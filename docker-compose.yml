# The Roach — static site container, fronted by Caddy.
#
# THIS SERVER (observed 2026-07-27):
#   · caddy:2.10 owns 0.0.0.0:80 and 0.0.0.0:443 — it is the reverse proxy and
#     it provisions TLS automatically. Nothing else may bind those ports.
#   · mailcow runs the mail stack (25/465/587/110/143/993/995).
#   · webuild is on 8090, mailcow's UI on 8080/8443.
#   · a shared docker network named `web` exists — that is how Caddy reaches
#     app containers by name.
#
# So this container does NOT publish 80. It joins `web`, and Caddy proxies to it
# as `theroach:80`. The site is a static export served by nginx inside the
# container (see Dockerfile — there is no Node at runtime, nothing on :3000).

services:
  theroach:
    build: .
    container_name: theroach
    restart: unless-stopped

    networks:
      # Caddy must share a network with this container to resolve `theroach`.
      - web

    # 3010 is published only so you can curl the container directly while
    # debugging, bypassing Caddy. Bound to LOCALHOST so it is not reachable from
    # the internet — otherwise people could hit the site on :3010 and skip your
    # TLS and the 410 redirects entirely. Delete this block once Caddy is live.
    ports:
      - "127.0.0.1:3010:80"

    # Static files only — nothing to persist, nothing writable.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

    # ONE exception to read_only: the click counter.
    #
    # `docker compose up -d --build` REPLACES this container, and `docker logs`
    # dies with it — so without a bind mount the WhatsApp click count would
    # reset to zero on every deploy, which for a site that deploys often makes
    # the number worthless. This survives rebuilds.
    #
    # The file holds a timestamp and a path, nothing else — no IPs, no user
    # agents. See the `event` log format in docker/nginx.conf for why.
    volumes:
      - ./logs:/var/log/site

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Journal desk (the client's CMS) ────────────────────────────────────────
  # Email + password, no GitHub account needed. Writes markdown and photos into
  # the site repo, commits, pushes, and touches .rebuild-requested so the host's
  # cron rebuilds. See docker/admin/server.js and RUNBOOK 3b.
  #
  # Secrets live in .env on the server, never in git:
  #   ADMIN_EMAIL=high@theroach.co.za
  #   ADMIN_PASSWORD_HASH=<salt:hash>
  #   SESSION_SECRET=<random>
  #   GIT_TOKEN=<fine-grained PAT, contents:write on this repo only>
  admin:
    build: ./docker/admin
    container_name: theroach-admin
    restart: unless-stopped
    networks:
      - web
    environment:
      # ADMIN_USERS is the current form: comma-separated `email=salt:hash`.
      # The ADMIN_EMAIL/ADMIN_PASSWORD_HASH pair below is the older single
      # account, kept so an existing .env keeps working; server.js merges both.
      # Leaving them out entirely is what broke the container on first run —
      # server.js read ADMIN_USERS while compose passed only the old names.
      ADMIN_USERS: ${ADMIN_USERS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GIT_REMOTE: github.com/GoodieGoodchild/theroach.git

    # The repo itself, writable — this is the one container that needs it, and
    # it is why everything else about this service is locked down. Mount the
    # compose directory, which IS the git working copy.
    volumes:
      - .:/repo

    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  web:
    # Created already by whatever brought Caddy up — do not let compose make a
    # second one, or Caddy will not be able to resolve `theroach`.
    external: true
