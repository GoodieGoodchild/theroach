# The Roach — container for the static site.
#
# ── WHY PORT 8080 AND NOT 80 ──────────────────────────────────────────────────
# Probed 41.203.18.177 (2026-07-27): ports 80 AND 443 are both already held by
# Apache — it is serving the xneelo placeholder, and answering TLS with xneelo's
# own *.jnb2.host-h.net wildcard. Binding this container to 80 would collide and
# the container would fail to start.
#
# So the container listens on 8080, bound to LOCALHOST ONLY (127.0.0.1), and
# Apache reverse-proxies to it. That means:
#   · nothing new is exposed to the internet — only Apache faces outward
#   · Apache keeps handling TLS, so the Let's Encrypt cert lives in one place
#   · you never have to stop Apache, which on this box may also be fronting
#     webmail or other vhosts you would not want to take down
#
# If you would rather the container own the ports directly, stop Apache first
# (`systemctl stop apache2 && systemctl disable apache2`), change the mapping to
# "80:80", and move TLS into the container — but then certificate renewal
# becomes your problem, and Apache already solves it.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: theroach:latest
    container_name: theroach
    restart: unless-stopped

    # 127.0.0.1 prefix is deliberate — without it Docker punches a hole straight
    # through the host firewall and 8080 becomes publicly reachable, bypassing
    # Apache, TLS and the redirects entirely.
    ports:
      - "127.0.0.1:8080:80"

    # Static files only. Nothing to persist, nothing to mount.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
