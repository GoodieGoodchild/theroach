# Apache vhost for theroach.co.za — put this in front of the container.
#
# Apache already owns ports 80 and 443 on this server, so rather than fight it,
# it terminates TLS and proxies to the container on 127.0.0.1:8080.
#
# Install (Debian/Ubuntu):
#   sudo a2enmod proxy proxy_http rewrite headers ssl
#   sudo cp apache-vhost.conf /etc/apache2/sites-available/theroach.conf
#   sudo a2ensite theroach
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Then issue the certificate — the box currently answers TLS with xneelo's
# *.jnb2.host-h.net wildcard, which is why HTTPS fails validation today:
#   sudo certbot --apache -d theroach.co.za -d www.theroach.co.za
# Certbot will rewrite the :80 block to redirect; that is fine and expected.

<VirtualHost *:80>
    ServerName theroach.co.za
    ServerAlias www.theroach.co.za

    # Canonical: https + www. The old indexed URLs were https://www., so www
    # wins and the legacy authority transfers.
    RewriteEngine On
    RewriteCond %{HTTPS} off [OR]
    RewriteCond %{HTTP_HOST} !^www\. [NC]
    RewriteRule ^ https://www.theroach.co.za%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName theroach.co.za
    ServerAlias www.theroach.co.za

    SSLEngine on
    # certbot fills these in — leave them until it does.
    # SSLCertificateFile    /etc/letsencrypt/live/theroach.co.za/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/theroach.co.za/privkey.pem

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^www\. [NC]
    RewriteRule ^ https://www.theroach.co.za%{REQUEST_URI} [L,R=301]

    # ── The old WooCommerce catalogue: 410 Gone ──────────────────────────────
    # Handled HERE, before the proxy, so these never reach the container.
    # 410 not 301: mass-redirecting dissimilar URLs to one homepage is treated
    # as a soft 404 and passes no equity, and 301ing a cannabis retail catalogue
    # onto a page that says "nothing is offered for sale" has the redirect map
    # contradicting the site's own disclaimer.
    RedirectMatch 410 ^/shop(/.*)?$
    RedirectMatch 410 ^/product-category(/.*)?$
    RedirectMatch 410 ^/product(/.*)?$
    RedirectMatch 410 ^/brand(/.*)?$
    RedirectMatch 410 ^/cannarootz(/.*)?$
    RedirectMatch 410 ^/cart(/.*)?$
    RedirectMatch 410 ^/checkout(/.*)?$
    RedirectMatch 410 ^/my-account(/.*)?$
    RedirectMatch 410 ^/wp-(admin|login|content|includes|json)(/.*)?$
    Redirect 301 /contact-us-the-roach/ https://www.theroach.co.za/

    # ── Proxy everything else to the container ───────────────────────────────
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Tell the container it is behind TLS, so it does not try to redirect to
    # https itself and create a loop.
    RequestHeader set X-Forwarded-Proto "https"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  ${APACHE_LOG_DIR}/theroach-error.log
    CustomLog ${APACHE_LOG_DIR}/theroach-access.log combined
</VirtualHost>
