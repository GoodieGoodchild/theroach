# The Roach — nginx config for the containerised static export.
#
# ⚠️ IMPORTANT: public/.htaccess is APACHE-ONLY and does NOTHING in this image.
# Every rule that matters is reimplemented below. If you change one, change both,
# or the two deployment paths will quietly diverge.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Canonical host ───────────────────────────────────────────────────────
    # The old indexed URLs were https://www.theroach.co.za, so www wins and the
    # legacy authority transfers. HTTPS is almost certainly terminated upstream
    # (proxy/load balancer), so trust X-Forwarded-Proto rather than $scheme —
    # redirecting on $scheme behind a TLS-terminating proxy is a redirect loop.
    if ($host = "theroach.co.za") {
        return 301 https://www.theroach.co.za$request_uri;
    }

    # ── The old WooCommerce catalogue: 410 Gone, NOT 301 ─────────────────────
    #
    # 410 rather than 301 for two reasons. Technically, mass-redirecting many
    # dissimilar URLs to one homepage is treated as a soft 404 — it passes no
    # equity and keeps the URL in the index far longer than a 410 does.
    # Substantively, 301ing a cannabis retail catalogue onto a page that states
    # "nothing is offered for sale" asserts continuity between the two: the
    # redirect map contradicting the site's own disclaimer.
    location ~ ^/(shop|product-category|product|brand|cannarootz|cart|checkout|my-account)(/|$) {
        return 410;
    }
    location ~ ^/(wp-admin|wp-login|wp-content|wp-includes|wp-json)(/|$) {
        return 410;
    }
    location = /xmlrpc.php { return 410; }

    # ── 301 only where the visitor still wants the same thing ────────────────
    location = /contact-us-the-roach/ {
        return 301 https://www.theroach.co.za/;
    }

    error_page 410 /410.html;
    location = /410.html { internal; }
    error_page 404 /404.html;
    location = /404.html { internal; }

    # ── Static export routing ────────────────────────────────────────────────
    # trailingSlash: true in next.config.mjs, so /path/ maps to /path/index.html.
    #
    # ⚠️ HTML IS NEVER SERVED FROM CACHE WITHOUT REVALIDATING. This is not a
    # tuning preference, it is correctness. Every deploy emits NEW hashed chunk
    # filenames and deletes the old ones, so an HTML file cached even briefly
    # can outlive the scripts it points at. The browser then 404s every script,
    # React never hydrates, and the visitor is left on the no-JS fallback: no
    # landing film, and the deck reduced to a plain scrolling document. It looks
    # exactly like the site is broken, it only affects returning visitors, and
    # it clears itself an hour later — which makes it near-impossible to
    # diagnose from a desk. It was previously `expires 1h`.
    #
    # "no-cache" does not mean "do not store"; it means revalidate first. The
    # ETag above makes that a 304 with an empty body, so the cost is one cheap
    # conditional request per navigation.
    #
    # add_header does NOT inherit into a location that declares its own, so the
    # two security headers are repeated here deliberately. Do not delete them.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── Caching ──────────────────────────────────────────────────────────────
    # Hashed build assets are immutable and safe to cache hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(webp|png|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # The hero video must support range requests so mobile can stream rather
    # than wait for the whole file. nginx does this by default; don't disable it.
    location ~* \.(mp4)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
    # No /index.html block: it used to set `expires 1h` and, because it declared
    # its own add_header, it also silently dropped the two security headers for
    # the most-requested file on the site. HTML caching is handled in `location /`
    # above, which covers every page rather than just the root.

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NOTE: deliberately NO X-Robots-Tag noindex here. That belongs on the Vercel
    # demo only — production must be indexable or none of the SEO work matters.
}
